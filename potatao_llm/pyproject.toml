[project]
name = "voice-system"
version = "0.1.0"
description = "Local & Cloud Voice Processing Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "faster-whisper>=1.0.0",
    "ollama>=0.2.0",
    "piper-tts>=1.2.0",
    "uvicorn[standard]>=0.28.0",    
    "websockets>=12.0",
]

[project.optional-dependencies]
cloud = [
    "elevenlabs>=1.0.0",
    "openai>=1.14.0",
]