[project]
name = "potatao-station"
version = "0.1.0"
description = "back-end python application of potatao website"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = [
    "common",
    "service"
]

[tool.uv] 
override-dependencies=[
    "fastapi==0.136.1",
    "sqlalchemy==2.0.49",
    "uvicorn[standard]==0.46.0",
    "boto3==1.43.6",
    "boto3-stubs[s3]==1.43.6",
    "PyJWT==2.12.1",
    "cryptography==48.0.0",
    "pysqlite3-binary==0.5.4.post2",
    "redis==7.4.0"
]

[tool.uv.sources]
common = {workspace = true}
service = {workspace = true}