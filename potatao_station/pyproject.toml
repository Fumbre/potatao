[project]
name = "potatao-station"
version = "0.1.0"
description = "back-end python application of potatao website"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = [
    "common",
    "service"
]

[tool.uv]
override-dependencies=[
    "fastapi==0.136.1",
    "sqlalchemy==2.0.49",
    "psycopg[binary]==3.3.4",
    "uvicorn[standard]==0.46.0"
]

[tool.uv.sources]
common = {workspace = true}
service = {workspace = true}